name: OariWallet

options:
  bundleIdPrefix: io.oari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  ReleaseTesting: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES
      # Defense in depth: this development-only resource is also excluded from
      # production target composition. Its only code reference is DEBUG-gated.
    ReleaseTesting:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  OariWalletModules:
    path: .

targets:
  OariWallet:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: OariWalletModules
        product: WalletDomain
      - package: OariWalletModules
        product: ProtocolEngine
      - package: OariWalletModules
        product: OariDesignSystem
      - package: OariWalletModules
        product: WalletVault
      - package: OariWalletModules
        product: EudiWalletKitAdapter
      - package: OariWalletModules
        product: EbsiW3CBackend
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Oari Wallet
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: OariMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Authenticate before sharing credentials or approving sensitive wallet actions.
        NSCameraUsageDescription: Scan credential offers and presentation requests.
        NSBluetoothAlwaysUsageDescription: Oari Wallet uses Bluetooth to securely exchange mobile documents with nearby devices during wallet presentations.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.oari.wallet.openid4vp
            CFBundleURLSchemes:
              - openid4vp
          - CFBundleURLName: io.oari.wallet.openid4vci
            CFBundleURLSchemes:
              - openid-credential-offer
          - CFBundleURLName: io.oari.wallet.eudi
            CFBundleURLSchemes:
              - haip-vci
              - haip-vp
              - eudi-openid4vp
              - mdoc-openid4vp
              - eu.europa.ec.euidi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: OariWallet
        PRODUCT_MODULE_NAME: OariWallet
        SWIFT_MODULE_NAME: OariWallet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Resources/OariWallet.entitlements
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        ReleaseTesting:
          ENABLE_TESTABILITY: YES
  WalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
       - path: Tests
    dependencies:
      - target: OariWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OariWallet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OariWallet"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
       - path: UITests
    dependencies:
      - target: OariWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.oari.wallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OariWallet

schemes:
  OariWallet:
    build:
      targets:
        OariWallet: all
        WalletTests: [test]
        WalletUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OariWallet
      targets:
        - name: WalletTests
          parallelizable: true
          randomExecutionOrder: true
        - name: WalletUITests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    archive:
      config: Release
